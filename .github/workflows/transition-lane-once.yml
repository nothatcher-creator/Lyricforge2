name: Transition lane one-shot

on:
  push:
    branches: [feat/creative-runtime-inline]
    paths:
      - .github/workflows/transition-lane-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-runtime-inline
          fetch-depth: 0
      - name: Mount transition lane and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          timeline_path=Path('components/editor/Timeline.tsx')
          source=timeline_path.read_text()
          import_needle="import {IconButton,Choice} from './Controls';\n"
          if "import TimelineTransitions from './TimelineTransitions';" not in source:
              if import_needle not in source:
                  raise SystemExit('Timeline Controls import not found')
              source=source.replace(import_needle,import_needle+"import TimelineTransitions from './TimelineTransitions';\n",1)
          lane='<div className="track-lane" data-track={track.id} style={{width}} onPointerDown={seek}>'
          mounted=lane+'<TimelineTransitions trackId={track.id} scale={scale}/>'
          if mounted not in source:
              if lane not in source:
                  raise SystemExit('Timeline lane needle not found')
              source=source.replace(lane,mounted,1)
          timeline_path.write_text(source)

          css_path=Path('app/globals.css')
          css=css_path.read_text()
          sentinel='/* timeline-transitions */'
          if sentinel not in css:
              css += '''\n\n/* timeline-transitions */\n.timeline-transition-layer{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:visible}.timeline-transition-add,.timeline-transition{position:absolute;top:6px;transform:translateX(-50%);pointer-events:auto;touch-action:none;min-height:36px;border-radius:7px}.timeline-transition-add{width:30px;border:1px solid #9d7950;background:#30291f;color:#f2b66d;font-size:18px;line-height:1;opacity:.18;transition:opacity .15s,background .15s}.track-lane:hover .timeline-transition-add,.timeline-transition-add:focus-visible{opacity:1}.timeline-transition{min-width:32px;border:1px solid #b58b55;background:#3b3023d9;color:#efc189;padding:0 13px;overflow:hidden;box-shadow:0 2px 8px #0005}.timeline-transition.selected{outline:2px solid #f2b66d;outline-offset:1px}.timeline-transition-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;pointer-events:none}[data-transition-handle]{position:absolute;right:0;top:0;width:12px;min-height:36px;height:100%;cursor:ew-resize;border-left:1px solid #f2b66d55}.timeline-transition:hover [data-transition-handle]{background:#f2b66d22}\n@media(pointer:coarse){.timeline-transition-add{opacity:1;min-width:36px;min-height:36px}}\n.mode-phone-portrait .timeline-transition-add{opacity:1;min-width:36px;min-height:36px}.mode-phone-portrait .timeline-transition{min-height:36px}.mode-phone-portrait [data-transition-handle]{min-width:18px;min-height:36px}\n'''
              css_path.write_text(css)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/editor/Timeline.tsx app/globals.css
          git diff --cached --check
          git commit -m "feat: mount transition controls in timeline"
          git push origin HEAD:feat/creative-runtime-inline
