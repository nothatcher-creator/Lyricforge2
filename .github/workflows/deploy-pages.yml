name: Deploy LyricForge to GitHub Pages

on:
  push:
    branches: [main, feat/source-foundation, feat/creative-catalog, feat/audio-aware-alignment-catalog-elements]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test -- --run
      - name: Run legacy regression tests
        run: pnpm run test:legacy
      - name: Build official creative catalog
        run: pnpm run catalog:build
      - name: Validate official creative catalog
        run: pnpm run catalog:validate
      - name: Build static LyricForge
        run: pnpm run build
      - name: Normalize GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist/client/Lyricforge2/_next ]; then
            rm -rf dist/client/_next
            mv dist/client/Lyricforge2/_next dist/client/_next
            rmdir dist/client/Lyricforge2
          fi
          touch dist/client/.nojekyll
      - name: Verify deployable site
        run: node scripts/verify-pages-build.mjs
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
