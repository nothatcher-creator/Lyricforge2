name: Deploy LyricForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract uploaded source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-src _site
          mkdir -p site-src _site
          unzip -q LyricForge-v2-source.zip -d site-src

          # If the zip contains one wrapper folder, work from inside it.
          shopt -s dotglob nullglob
          entries=(site-src/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* site-src/ 2>/dev/null || true
            rmdir "${entries[0]}" 2>/dev/null || true
          fi

          echo "Extracted files:"
          find site-src -maxdepth 2 -type f | sort | head -200

      - name: Build or prepare site
        shell: bash
        run: |
          set -euo pipefail
          cd site-src

          if [ -f package.json ]; then
            echo "package.json detected; installing dependencies"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            echo "Building app"
            if npm run | grep -qE '^  build'; then
              # Vite accepts --base; other tools may ignore/fail, so retry normally.
              npm run build -- --base=/Lyricforge2/ || npm run build
            else
              echo "No build script found; treating source as static"
            fi

            for dir in dist build out public; do
              if [ -f "$dir/index.html" ]; then
                cp -a "$dir"/. ../_site/
                break
              fi
            done
          fi

          # Static fallback: use the directory containing the first index.html.
          if [ ! -f ../_site/index.html ]; then
            index_path="$(find . -type f -name index.html -print -quit)"
            if [ -z "$index_path" ]; then
              echo "ERROR: No deployable index.html was found after extraction/build."
              exit 1
            fi
            index_dir="$(dirname "$index_path")"
            cp -a "$index_dir"/. ../_site/
          fi

          touch ../_site/.nojekyll
          echo "Deploying these files:"
          find ../_site -maxdepth 2 -type f | sort | head -200

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
