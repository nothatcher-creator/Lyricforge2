name: Test LyricForge GitHub Pages build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir source
          unzip -q LyricForge-v2-source.zip -d source
          shopt -s dotglob nullglob
          entries=(source/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* source/ 2>/dev/null || true
            rmdir "${entries[0]}" 2>/dev/null || true
          fi

      - name: Adapt source for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -f source/app/chatgpt-auth.ts

          cat > source/next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            assetPrefix: "/Lyricforge2",
            trailingSlash: true,
          };

          export default nextConfig;
          EOF

          cat > source/vite.config.ts <<'EOF'
          import vinext from "vinext";
          import { defineConfig } from "vite";

          export default defineConfig({
            plugins: [vinext({ prerender: { routes: "*" } })],
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          page = Path('source/app/page.tsx')
          page_text = page.read_text()
          if 'export const dynamic' not in page_text:
              page_text = 'export const dynamic = "force-static";\n' + page_text
              page.write_text(page_text)

          roots = [Path('source/app'), Path('source/components'), Path('source/lib')]
          for root in roots:
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text()
                  text = text.replace('"/favicon.svg"', '"/Lyricforge2/favicon.svg"')
                  text = text.replace("'/favicon.svg'", "'/Lyricforge2/favicon.svg'")
                  text = text.replace("'/workers/", "'/Lyricforge2/workers/")
                  text = text.replace('"/workers/', '"/Lyricforge2/workers/')
                  path.write_text(text)
          PY

          if grep -RInE 'next/headers|headers\(|cookies\(|redirect\(' source/app source/components source/lib --include='*.ts' --include='*.tsx'; then
            echo 'ERROR: server-only dynamic APIs remain in static build source.'
            exit 1
          fi

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build static export
        working-directory: source
        run: npm run build

      - name: Verify GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          echo 'Exported files:'
          find source/dist/client -maxdepth 2 -type f | sort | head -100 || true
          test -f source/dist/client/index.html
          test -f source/dist/client/workers/analysis.js
          test -f source/dist/client/workers/transcription.js
          grep -q 'LyricForge' source/dist/client/index.html
          ! grep -q 'Cloudflare Local Explorer' source/dist/client/index.html
          grep -q '/Lyricforge2/' source/dist/client/index.html
          ! grep -RqsE "['\"]/(workers/|favicon\.svg)" source/dist/client --include='*.html' --include='*.js'
          echo 'Static export validation passed.'

      - name: Upload tested static site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyricforge-pages-test
          path: source/dist/client
          retention-days: 1
