name: Promote LyricForge source

on:
  push:
    branches: [feat/source-foundation]
    paths:
      - .github/workflows/promote-source.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/source-foundation

      - name: Extract source archive into tracked root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-unpack
          mkdir .source-unpack
          unzip -q LyricForge-v2-source.zip -d .source-unpack
          shopt -s dotglob nullglob
          entries=(.source-unpack/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. ./
          else
            cp -a .source-unpack/. ./
          fi
          rm -rf .source-unpack
          rm -f app/chatgpt-auth.ts

          test -f app/page.tsx
          test -f components/editor/Editor.tsx
          test -f public/workers/transcription.js
          test -f package.json
          test -f docs/superpowers/specs/2026-09-13-mobile-effects-catalog-design.md
          test -f docs/superpowers/plans/2026-09-13-source-foundation.md
          test -f .github/workflows/deploy-pages.yml

          if grep -RInE 'next/headers|headers\(|cookies\(|redirect\(' app components lib --include='*.ts' --include='*.tsx'; then
            echo 'server-only dynamic API remains in browser source'
            exit 1
          fi

      - name: Commit promoted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: promote LyricForge source into repository'
          git push origin HEAD:feat/source-foundation
