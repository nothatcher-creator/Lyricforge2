name: Verify Creative Catalog Branch

on:
  push:
    branches: [feat/creative-catalog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run catalog tests
        run: pnpm exec vitest run lib/lyricforge/__tests__/catalog-validation.test.ts lib/lyricforge/__tests__/catalog-package.test.ts lib/lyricforge/__tests__/catalog-storage.test.ts lib/lyricforge/__tests__/catalog-installer.test.ts lib/lyricforge/__tests__/catalog-creative.test.ts lib/lyricforge/__tests__/catalog-dependencies.test.ts lib/lyricforge/__tests__/project-catalog-bundle.test.ts lib/lyricforge/__tests__/project-migration.test.ts
      - name: Typecheck
        run: pnpm run typecheck
