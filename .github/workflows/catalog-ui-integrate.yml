name: Apply Catalog Workspace Integration

on:
  push:
    branches: [feat/creative-catalog]
    paths:
      - scripts/apply-catalog-workspace.mjs
      - .github/workflows/catalog-ui-integrate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-catalog
      - name: Patch editor workspace and catalog styles
        run: node scripts/apply-catalog-workspace.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/editor/Editor.tsx app/globals.css
          git commit -m "feat: integrate catalog into editor workspace"
          git push origin HEAD:feat/creative-catalog
