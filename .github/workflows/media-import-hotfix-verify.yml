name: Verify Media Import Hotfix

on:
  push:
    branches: [fix/media-import-preserve-layers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run media import regression tests
        run: pnpm exec vitest run lib/lyricforge/__tests__/media-import.test.ts
      - name: Typecheck
        run: pnpm run typecheck
