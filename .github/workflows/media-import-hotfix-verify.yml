name: Verify Media Import Hotfix

on:
  push:
    branches: [fix/media-import-preserve-layers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full unit suite
        run: pnpm test -- --run
      - name: Run legacy regression tests
        run: pnpm run test:legacy
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build official creative catalog
        run: pnpm run catalog:build
      - name: Validate official creative catalog
        run: pnpm run catalog:validate
      - name: Build static LyricForge
        run: pnpm run build
      - name: Normalize GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist/client/Lyricforge2/_next ]; then
            rm -rf dist/client/_next
            mv dist/client/Lyricforge2/_next dist/client/_next
            rmdir dist/client/Lyricforge2
          fi
          touch dist/client/.nojekyll
      - name: Verify deployable site
        run: node scripts/verify-pages-build.mjs
