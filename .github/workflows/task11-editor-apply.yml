name: Apply Task 11 Editor Integration

on:
  push:
    branches: [feat/creative-catalog]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply task11 editor integration' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-catalog
          fetch-depth: 0
      - name: Patch editor dependency recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('components/editor/Editor.tsx')
          text=path.read_text()
          replacements=[
            ("import {saveProject,lastProject,openProject,importProject,projectFile,download,saveSetting,loadSetting} from '@/lib/lyricforge/project-manager';", "import {saveProject,lastProject,openProject,importProject,projectFile,download,saveSetting,loadSetting,resolveCurrentProjectDependencies,UnknownFontLicenseBundleError} from '@/lib/lyricforge/project-manager';\nimport type {ProjectDependency} from '@/lib/lyricforge/creative-assets';\nimport type {ProjectDependencyResolution} from '@/lib/lyricforge/catalog-dependencies';"),
            ("import CatalogPanel from './CatalogPanel';", "import CatalogPanel from './CatalogPanel';\nimport RestoreDependenciesPanel from './RestoreDependenciesPanel';"),
            ("function Workspace(){const {project,selected}=useEditor();const [{service:catalogService,installer:catalogInstaller}]=useState(()=>getBrowserCatalogClient());const [ready,setReady]=useState(false);", "function Workspace(){const {project,selected}=useEditor();const [{service:catalogService,installer:catalogInstaller,syncInstalled}]=useState(()=>getBrowserCatalogClient());const [ready,setReady]=useState(false);const [missingDependencies,setMissingDependencies]=useState<ProjectDependencyResolution[]>([]);"),
            ("}audioEngine.setProject(store.project);audioEngine.seek(id?0:1600);", "}await syncInstalled();audioEngine.setProject(store.project);audioEngine.seek(id?0:1600);"),
            ("const bundle=useCallback(async()=>{setProcessing('Bundling project and media…');try{download(await projectFile(store.project),store.project.name+'.lyricforge');await save();}catch(e){toast.error(e instanceof Error?e.message:String(e));}finally{setProcessing('');}},[save]);", "const bundle=useCallback(async()=>{setProcessing('Bundling project and media…');try{let blob:Blob;try{blob=await projectFile(store.project);}catch(e){if(!(e instanceof UnknownFontLicenseBundleError))throw e;const ok=window.confirm(`This project includes user-imported font files whose redistribution rights LyricForge cannot verify:\n\n${e.fonts.join('\\n')}\n\nInclude these font files in the shareable project bundle?`);if(!ok)return;blob=await projectFile(store.project,{allowUnknownFontLicenses:true});}download(blob,store.project.name+'.lyricforge');await save();}catch(e){toast.error(e instanceof Error?e.message:String(e));}finally{setProcessing('');}},[save]);"),
            ("if(['lyricforge','zip'].includes(ext)){await saveProject(store.project);const p=await importProject(file);store.setProject(p);audioEngine.setProject(p);", "if(['lyricforge','zip'].includes(ext)){await saveProject(store.project);const p=await importProject(file);await syncInstalled();store.setProject(p);audioEngine.setProject(p);"),
            ("importRef.current=importFiles;\n useEffect(()=>{const key=", "importRef.current=importFiles;\n const refreshMissingDependencies=useCallback(async(p:Project=store.project)=>{const resolved=await resolveCurrentProjectDependencies(p);setMissingDependencies(resolved.filter(item=>item.status==='missing'));},[]);\n useEffect(()=>{if(!ready)return;let active=true;const timer=setTimeout(()=>{void resolveCurrentProjectDependencies(project).then(resolved=>{if(active)setMissingDependencies(resolved.filter(item=>item.status==='missing'));});},120);return()=>{active=false;clearTimeout(timer);};},[project,ready]);\n const restoreDependency=useCallback(async(dependency:ProjectDependency)=>{const manifest=catalogService.findExact(dependency.type,dependency.id,dependency.version);if(!manifest)throw new Error(`The official catalog does not currently contain ${dependency.id}@${dependency.version}. Use Locate, Substitute, or Bypass instead.`);await catalogInstaller.install(manifest);await catalogService.refreshLocalState();await syncInstalled();await refreshMissingDependencies();toast(`${manifest.name} ${manifest.version} restored`);},[catalogService,catalogInstaller,syncInstalled,refreshMissingDependencies]);\n const restoreAllDependencies=useCallback(async(dependencies:ProjectDependency[])=>{for(const dependency of dependencies){const manifest=catalogService.findExact(dependency.type,dependency.id,dependency.version);if(!manifest)throw new Error(`The official catalog does not currently contain ${dependency.id}@${dependency.version}.`);await catalogInstaller.install(manifest);}await catalogService.refreshLocalState();await syncInstalled();await refreshMissingDependencies();toast(`${dependencies.length} exact dependenc${dependencies.length===1?'y':'ies'} restored`);},[catalogService,catalogInstaller,syncInstalled,refreshMissingDependencies]);\n useEffect(()=>{const key="),
            ("}</button></div>}<Tabs value={tab}", "}</button></div>}{missingDependencies.length?<RestoreDependenciesPanel missing={missingDependencies} onRestore={restoreDependency} onRestoreAll={restoreAllDependencies}/>:null}<Tabs value={tab}")
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit(f'missing Editor patch target: {old[:140]}')
            text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Commit editor integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/editor/Editor.tsx
          git commit -m "feat: surface exact project dependency recovery"
          git push origin HEAD:feat/creative-catalog
