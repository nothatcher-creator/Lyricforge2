name: Task10 RED diagnostics one-shot

on:
  push:
    branches: [feat/creative-runtime-inline]
    paths:
      - .github/workflows/task10-red-diagnostics-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-runtime-inline
          fetch-depth: 0
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Capture focused failures
        shell: bash
        run: |
          set +e
          pnpm exec vitest run components/editor/__tests__/TimelineTransitions.test.tsx components/editor/__tests__/Inspector.transition.test.tsx --reporter=verbose > task10-red-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> task10-red-diagnostics.txt
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add task10-red-diagnostics.txt
          git commit -m "chore: capture task10 red failures"
          git push origin HEAD:feat/creative-runtime-inline
