name: Preview Mobile Final Verification

on:
  push:
    branches: [feat/source-foundation]
    paths:
      - .github/workflows/preview-mobile-final-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/source-foundation
      - name: Clean dependency install
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Run all automated tests
        run: |
          pnpm test -- --run
          pnpm run test:legacy
      - name: Build and validate GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          if [ -d dist/client/Lyricforge2/_next ]; then
            rm -rf dist/client/_next
            mv dist/client/Lyricforge2/_next dist/client/_next
            rmdir dist/client/Lyricforge2
          fi
          touch dist/client/.nojekyll
          node scripts/verify-pages-build.mjs
      - name: Verify preview and mobile source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'preview-inline-editor' components/editor/Preview.tsx
          grep -q 'onTextSelected' components/editor/Preview.tsx
          grep -q 'mode-${workspaceMode}' components/editor/Editor.tsx
          grep -q 'MobileSheetHandle' components/editor/Inspector.tsx
          grep -q 'data-timeline-scroller' components/editor/Timeline.tsx
          grep -q 'data-clip-handle="start"' components/editor/Timeline.tsx
          grep -q 'data-clip-handle="end"' components/editor/Timeline.tsx
          grep -q '@media (max-width:760px) and (orientation:portrait)' app/globals.css
          grep -q '.mode-phone-portrait .timeline-clip{top:4px;height:42px' app/globals.css
          echo 'Preview/mobile phase invariants passed.'
