name: Task10 transition editing one-shot

on:
  push:
    branches: [feat/creative-runtime-inline]
    paths:
      - .github/workflows/task10-green-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-runtime-inline
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/task10-patch.py
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/editor/TimelineTransitions.tsx components/editor/CreativeInspector.tsx components/editor/Inspector.tsx app/globals.css
          git diff --cached --check
          git commit -m "feat: edit transitions from timeline and inspector"
          git push origin HEAD:feat/creative-runtime-inline
