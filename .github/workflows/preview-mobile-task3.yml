name: Preview Mobile Task 3

on:
  push:
    branches: [feat/source-foundation]
    paths:
      - .github/workflows/preview-mobile-task3.yml

permissions:
  contents: write

jobs:
  workspace-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/source-foundation
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: RED - add phone panel policy tests
        shell: bash
        run: |
          cat > lib/lyricforge/__tests__/workspace-layout.test.ts <<'EOF'
          import {describe,expect,it} from 'vitest';
          import {classifyWorkspace,resolveWorkspacePanels} from '../workspace-layout';
          describe('classifyWorkspace',()=>{
            it('uses phone portrait for a narrow portrait coarse viewport',()=>expect(classifyWorkspace(390,844,true)).toBe('phone-portrait'));
            it('uses compact for a landscape phone',()=>expect(classifyWorkspace(844,390,true)).toBe('compact'));
            it('keeps wide desktop as desktop',()=>expect(classifyWorkspace(1440,900,false)).toBe('desktop'));
          });
          describe('resolveWorkspacePanels',()=>{
            it('starts phone portrait with side panels closed',()=>expect(resolveWorkspacePanels('phone-portrait',{left:true,right:true},'initialize')).toEqual({left:false,right:false}));
            it('opening the library on phone closes the inspector',()=>expect(resolveWorkspacePanels('phone-portrait',{left:false,right:true},'library',true)).toEqual({left:true,right:false}));
            it('opening the inspector on phone closes the library',()=>expect(resolveWorkspacePanels('phone-portrait',{left:true,right:false},'inspector',true)).toEqual({left:false,right:true}));
            it('desktop inspector changes do not collapse the library',()=>expect(resolveWorkspacePanels('desktop',{left:true,right:false},'inspector',true)).toEqual({left:true,right:true}));
          });
          EOF
          if pnpm test -- --run lib/lyricforge/__tests__/workspace-layout.test.ts; then
            echo 'Expected new panel-policy tests to fail before implementation.' >&2
            exit 1
          fi
      - name: GREEN - implement workspace panel policy and responsive editor wiring
        shell: bash
        run: |
          cat > lib/lyricforge/workspace-layout.ts <<'EOF'
          export type WorkspaceMode='phone-portrait'|'compact'|'desktop';
          export interface WorkspacePanels{left:boolean;right:boolean}
          export type WorkspacePanelAction='initialize'|'library'|'inspector';
          export function classifyWorkspace(width:number,height:number,coarsePointer:boolean):WorkspaceMode{
            if(width<=760&&height>width&&coarsePointer)return 'phone-portrait';
            if(width<1100||coarsePointer)return 'compact';
            return 'desktop';
          }
          export function resolveWorkspacePanels(mode:WorkspaceMode,current:WorkspacePanels,action:WorkspacePanelAction,open=true):WorkspacePanels{
            if(mode!=='phone-portrait'){
              if(action==='initialize')return current;
              return action==='library'?{...current,left:open}:{...current,right:open};
            }
            if(action==='initialize')return {left:false,right:false};
            if(action==='library')return open?{left:true,right:false}:{...current,left:false};
            return open?{left:false,right:true}:{...current,right:false};
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/editor/Editor.tsx')
          s=p.read_text()
          needle="import {publicPath} from '@/lib/lyricforge/public-path';"
          repl=needle+"\nimport {classifyWorkspace,resolveWorkspacePanels,type WorkspaceMode} from '@/lib/lyricforge/workspace-layout';"
          if "workspace-layout" not in s:
              s=s.replace(needle,repl)
          old="function Workspace(){const {project,selected}=useEditor();const [ready,setReady]=useState(false);const [tab,setTab]=useState('lyrics');const [modal,setModal]=useState<Modal>(null);const [saveState,setSaveState]=useState('Opening session');const [processing,setProcessing]=useState('');const [left,setLeft]=useState(true);const [right,setRight]=useState(true);"
          new="function Workspace(){const {project,selected}=useEditor();const [ready,setReady]=useState(false);const [tab,setTab]=useState('lyrics');const [modal,setModal]=useState<Modal>(null);const [saveState,setSaveState]=useState('Opening session');const [processing,setProcessing]=useState('');const [left,setLeft]=useState(true);const [right,setRight]=useState(true);const [workspaceMode,setWorkspaceMode]=useState<WorkspaceMode>(()=>typeof window==='undefined'?'desktop':classifyWorkspace(window.innerWidth,window.innerHeight,window.matchMedia('(pointer: coarse)').matches));"
          if old not in s:
              raise SystemExit('Workspace state anchor not found')
          s=s.replace(old,new,1)
          anchor=" const analyze=useCallback((asset:Asset)=>"
          lifecycle=""" useEffect(()=>{const coarse=window.matchMedia('(pointer: coarse)');const update=()=>setWorkspaceMode(classifyWorkspace(window.innerWidth,window.innerHeight,coarse.matches));update();window.addEventListener('resize',update);coarse.addEventListener?.('change',update);return()=>{window.removeEventListener('resize',update);coarse.removeEventListener?.('change',update);};},[]);\n useEffect(()=>{if(workspaceMode==='phone-portrait'){const next=resolveWorkspacePanels(workspaceMode,{left,right},'initialize');setLeft(next.left);setRight(next.right);}},[workspaceMode]);\n const setPanel=useCallback((action:'library'|'inspector',open:boolean)=>{const next=resolveWorkspacePanels(workspaceMode,{left,right},action,open);setLeft(next.left);setRight(next.right);},[workspaceMode,left,right]);\n"""
          if lifecycle.strip() not in s:
              s=s.replace(anchor,lifecycle+anchor,1)
          oldpersist=" useEffect(()=>{if(ready)void saveSetting('workspace',{leftWidth,rightWidth,timelineHeight,guide});},[leftWidth,rightWidth,timelineHeight,guide,ready]);"
          newpersist=" useEffect(()=>{if(ready&&workspaceMode!=='phone-portrait')void saveSetting('workspace',{leftWidth,rightWidth,timelineHeight,guide});},[leftWidth,rightWidth,timelineHeight,guide,ready,workspaceMode]);"
          if oldpersist not in s:
              raise SystemExit('Persistence anchor not found')
          s=s.replace(oldpersist,newpersist,1)
          oldchange=" const changeTab=(value:string)=>{setTab(value);setLeft(true);if(window.innerWidth<1000)setRight(false);};"
          newchange=" const changeTab=(value:string)=>{setTab(value);if(workspaceMode==='phone-portrait')setPanel('library',true);else{setLeft(true);if(window.innerWidth<1000)setRight(false);}};"
          if oldchange not in s:
              raise SystemExit('changeTab anchor not found')
          s=s.replace(oldchange,newchange,1)
          oldmain="return <main className={`studio ${!left?'left-collapsed':''} ${!right?'right-collapsed':''}`}"
          newmain="return <main className={`studio mode-${workspaceMode} ${!left?'left-collapsed':''} ${!right?'right-collapsed':''}`}"
          if oldmain not in s:
              raise SystemExit('main class anchor not found')
          s=s.replace(oldmain,newmain,1)
          oldpreview="<Preview onFormat={()=>setModal('format')} onLeft={()=>{setLeft(v=>!v);if(window.innerWidth<1000)setRight(false);}} onRight={()=>{setRight(v=>!v);if(window.innerWidth<1000)setLeft(false);}}/>"
          newpreview="<Preview onFormat={()=>setModal('format')} onTextSelected={()=>{if(workspaceMode==='phone-portrait')setPanel('inspector',true);}} onLeft={()=>{if(workspaceMode==='phone-portrait')setPanel('library',!left);else{setLeft(v=>!v);if(window.innerWidth<1000)setRight(false);}}} onRight={()=>{if(workspaceMode==='phone-portrait')setPanel('inspector',!right);else{setRight(v=>!v);if(window.innerWidth<1000)setLeft(false);}}}/>"
          if oldpreview not in s:
              raise SystemExit('Preview anchor not found')
          s=s.replace(oldpreview,newpreview,1)
          p.write_text(s)
          PY
      - name: Verify Task 3
        run: |
          pnpm test -- --run lib/lyricforge/__tests__/workspace-layout.test.ts
          pnpm test -- --run
          pnpm run test:legacy
          pnpm run build
          grep -q 'mode-${workspaceMode}' components/editor/Editor.tsx
          grep -q 'onTextSelected' components/editor/Editor.tsx
      - name: Commit Task 3
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/editor/Editor.tsx lib/lyricforge/workspace-layout.ts lib/lyricforge/__tests__/workspace-layout.test.ts
          git commit -m 'feat: add responsive workspace modes'
          git push origin HEAD:feat/source-foundation
