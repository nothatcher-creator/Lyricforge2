name: Inspector type fix one-shot

on:
  push:
    branches: [feat/creative-runtime-inline]
    paths:
      - .github/workflows/inspector-typefix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creative-runtime-inline
          fetch-depth: 0
      - name: Apply type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('components/editor/Inspector.tsx')
          source=path.read_text()
          old="onChange={v=>patch({emphasis:v})}"
          new="onChange={v=>patch({emphasis:v as Style['emphasis']})}"
          if old not in source:
              raise SystemExit('Expected emphasis handler not found')
          source=source.replace(old,new,1)
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/editor/Inspector.tsx
          git diff --cached --check
          git commit -m "fix: type creative emphasis selection"
          git push origin HEAD:feat/creative-runtime-inline
