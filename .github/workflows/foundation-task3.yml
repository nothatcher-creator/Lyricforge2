name: Foundation Task 3 - Tracked Pages Build

on:
  push:
    branches: [feat/source-foundation]
    paths:
      - .github/workflows/foundation-task3.yml

permissions:
  contents: write

jobs:
  tracked-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/source-foundation

      - name: Enable pnpm and install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm add -D esbuild@0.28.0

      - name: Implement tracked static Pages configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/lyricforge/__tests__/public-path.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { publicPath } from "../public-path";

          describe("publicPath", () => {
            it("uses the Pages prefix when the page is under /Lyricforge2", () => {
              expect(publicPath("/workers/analysis.js", "/Lyricforge2/")).toBe("/Lyricforge2/workers/analysis.js");
            });
            it("uses a root public path during local development", () => {
              expect(publicPath("/workers/analysis.js", "/")).toBe("/workers/analysis.js");
            });
            it("does not double-prefix a production path", () => {
              expect(publicPath("/Lyricforge2/favicon.svg", "/Lyricforge2/editor")).toBe("/Lyricforge2/favicon.svg");
            });
          });
          EOF

          cat > lib/lyricforge/public-path.ts <<'EOF'
          export const APP_BASE_PATH = "/Lyricforge2";

          export function publicPath(path: string, pathname?: string): string {
            const normalized = path.startsWith("/") ? path : `/${path}`;
            if (normalized === APP_BASE_PATH || normalized.startsWith(`${APP_BASE_PATH}/`)) return normalized;
            const currentPath = pathname ?? (typeof window !== "undefined" ? window.location.pathname : APP_BASE_PATH);
            return currentPath === APP_BASE_PATH || currentPath.startsWith(`${APP_BASE_PATH}/`)
              ? `${APP_BASE_PATH}${normalized}`
              : normalized;
          }
          EOF

          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            assetPrefix: "/Lyricforge2",
            trailingSlash: true,
          };

          export default nextConfig;
          EOF

          cat > vite.config.ts <<'EOF'
          import vinext from "vinext";
          import { defineConfig } from "vite";

          export default defineConfig({
            plugins: [vinext({ prerender: { routes: "*" } })],
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          if 'export const dynamic' not in text:
              page.write_text('export const dynamic = "force-static";\n' + text)

          editor = Path('components/editor/Editor.tsx')
          text = editor.read_text()
          needle = "import {store,useEditor} from '@/lib/lyricforge/store';"
          if "@/lib/lyricforge/public-path" not in text:
              text = text.replace(needle, needle + "\nimport {publicPath} from '@/lib/lyricforge/public-path';")
          text = text.replace('src="/favicon.svg"', 'src={publicPath("/favicon.svg")}')
          text = text.replace("new Worker('/workers/analysis.js')", "new Worker(publicPath('/workers/analysis.js'))")
          editor.write_text(text)

          trans = Path('lib/lyricforge/transcription.ts')
          text = trans.read_text()
          if "./public-path" not in text:
              text = text.replace("import {makeClip,uid,type Clip,type Word} from './model';", "import {makeClip,uid,type Clip,type Word} from './model';\nimport {publicPath} from './public-path';")
          text = text.replace("new Worker('/workers/transcription.js',{type:'module'})", "new Worker(publicPath('/workers/transcription.js'),{type:'module'})")
          trans.write_text(text)

          sw = Path('lib/lyricforge/software-exporter.ts')
          text = sw.read_text()
          if "./public-path" not in text:
              text = text.replace("import type {ExportSettings} from './exporter';", "import type {ExportSettings} from './exporter';\nimport {publicPath} from './public-path';")
          text = text.replace("fetch('/workers/ffmpeg-manifest.json'", "fetch(publicPath('/workers/ffmpeg-manifest.json')")
          text = text.replace("fetch('/workers/'+manifest.parts[i]", "fetch(publicPath('/workers/'+manifest.parts[i])")
          text = text.replace("classWorkerURL:location.origin+'/workers/ffmpeg-worker.js',coreURL:location.origin+'/workers/ffmpeg-core.js'", "classWorkerURL:location.origin+publicPath('/workers/ffmpeg-worker.js'),coreURL:location.origin+publicPath('/workers/ffmpeg-core.js')")
          sw.write_text(text)

          tw = Path('lib/lyricforge/transcription.worker.ts')
          tw.write_text(tw.read_text().replace("env.backends.onnx.wasm!.wasmPaths='/workers/';", "env.backends.onnx.wasm!.wasmPaths=self.location.pathname.startsWith('/Lyricforge2/')?'/Lyricforge2/workers/':'/workers/';"))

          layout = Path('app/layout.tsx')
          text = layout.read_text().replace('icon: "/favicon.svg"', 'icon: "/Lyricforge2/favicon.svg"').replace('shortcut: "/favicon.svg"', 'shortcut: "/Lyricforge2/favicon.svg"')
          layout.write_text(text)

          worker = Path('public/workers/transcription.js')
          text = worker.read_text().replace('wasmPaths="/workers/"', 'wasmPaths="/Lyricforge2/workers/"').replace("wasmPaths='/workers/'", "wasmPaths='/Lyricforge2/workers/'")
          worker.write_text(text)

          legacy = Path('scripts/test.mjs')
          text = legacy.read_text()
          text = text.replace("if(compile.status)process.exit(compile.status);", "if(compile.error){console.error('Could not start esbuild for legacy tests:',compile.error);process.exit(1);}if(compile.status)process.exit(compile.status);")
          legacy.write_text(text)
          PY

      - name: Add Pages verifier and direct-source deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/verify-pages-build.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const root = path.resolve("dist/client");
          for (const relative of ["index.html", "workers/analysis.js", "workers/transcription.js"]) {
            if (!fs.existsSync(path.join(root, relative))) throw new Error(`Missing Pages artifact: ${relative}`);
          }
          const html = fs.readFileSync(path.join(root, "index.html"), "utf8");
          if (!html.includes("LyricForge")) throw new Error("LyricForge marker missing from index.html");
          if (html.includes("Cloudflare Local Explorer")) throw new Error("Wrong Cloudflare explorer artifact exported");
          if (!html.includes("/Lyricforge2/_next/")) throw new Error("GitHub Pages asset prefix missing");
          const worker = fs.readFileSync(path.join(root, "workers/transcription.js"), "utf8");
          if (!worker.includes("/Lyricforge2/workers/")) throw new Error("Worker WASM path is not prefixed");
          if (fs.existsSync(path.join(root, "Lyricforge2"))) throw new Error("Nested Lyricforge2 output directory remains after normalization");
          console.log("GitHub Pages artifact validation passed.");
          EOF

          cat > /tmp/deploy-pages.template <<'EOF'
          name: Deploy LyricForge to GitHub Pages

          on:
            push:
              branches: [main, feat/source-foundation]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages-__GITHUB_REF__
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - name: Enable pinned pnpm
                  run: |
                    corepack enable
                    corepack prepare pnpm@11.25.0 --activate
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
                - name: Run unit tests
                  run: pnpm test -- --run
                - name: Run legacy regression tests
                  run: pnpm run test:legacy
                - name: Build static LyricForge
                  run: pnpm run build
                - name: Normalize GitHub Pages artifact
                  shell: bash
                  run: |
                    set -euo pipefail
                    if [ -d dist/client/Lyricforge2/_next ]; then
                      rm -rf dist/client/_next
                      mv dist/client/Lyricforge2/_next dist/client/_next
                      rmdir dist/client/Lyricforge2
                    fi
                    touch dist/client/.nojekyll
                - name: Verify deployable site
                  run: node scripts/verify-pages-build.mjs
                - name: Configure Pages
                  if: github.ref == 'refs/heads/main'
                  uses: actions/configure-pages@v5
                - name: Upload Pages artifact
                  if: github.ref == 'refs/heads/main'
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: dist/client

            deploy:
              if: github.ref == 'refs/heads/main'
              environment:
                name: github-pages
                url: __PAGE_URL__
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          EOF
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/deploy-pages.template').read_text()
          text = text.replace('__GITHUB_REF__', '$' + '{{ github.ref }}')
          text = text.replace('__PAGE_URL__', '$' + '{{ steps.deployment.outputs.page_url }}')
          Path('.github/workflows/deploy-pages.yml').write_text(text)
          PY

      - name: Assert paths, tests, and static build
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "new Worker('/workers/" components/editor/Editor.tsx lib/lyricforge/transcription.ts
          ! grep -n "fetch('/workers/" lib/lyricforge/software-exporter.ts
          ! grep -n "location.origin+'/workers/" lib/lyricforge/software-exporter.ts
          ! grep -n 'src="/favicon.svg"' components/editor/Editor.tsx
          grep -q '/Lyricforge2/favicon.svg' app/layout.tsx
          grep -q '/Lyricforge2/workers/' public/workers/transcription.js
          pnpm test -- --run
          pnpm run test:legacy
          pnpm run build
          if [ -d dist/client/Lyricforge2/_next ]; then
            rm -rf dist/client/_next
            mv dist/client/Lyricforge2/_next dist/client/_next
            rmdir dist/client/Lyricforge2
          fi
          touch dist/client/.nojekyll
          node scripts/verify-pages-build.mjs

      - name: Commit tracked Pages implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml scripts/test.mjs next.config.ts vite.config.ts app/page.tsx app/layout.tsx lib/lyricforge/public-path.ts lib/lyricforge/__tests__/public-path.test.ts components/editor/Editor.tsx lib/lyricforge/transcription.ts lib/lyricforge/software-exporter.ts lib/lyricforge/transcription.worker.ts public/workers/transcription.js scripts/verify-pages-build.mjs .github/workflows/deploy-pages.yml
          git commit -m 'build: deploy tracked LyricForge source to Pages'
          git push origin HEAD:feat/source-foundation
